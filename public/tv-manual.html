<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Vendas manuais do painel</title>
    <style>
      body { margin: 0; font-family: system-ui, sans-serif; background: #f5f5f3; color: #1a1a19; }
      main { max-width: 960px; margin: 0 auto; padding: 24px 16px; }
      h1 { font-size: 22px; margin: 0 0 6px; }
      p { color: #555; margin: 0 0 16px; line-height: 1.4; }
      textarea { width: 100%; box-sizing: border-box; min-height: 460px; font: 13px/1.45 ui-monospace, Consolas, monospace; padding: 12px; border: 1px solid #ccc; border-radius: 8px; }
      .actions { display: flex; flex-wrap: wrap; gap: 10px; margin: 12px 0; }
      button { font: inherit; padding: 10px 16px; border-radius: 8px; border: 1px solid #1f7a4a; background: #2fb36b; color: #fff; cursor: pointer; }
      button.secondary { background: #fff; color: #1a1a19; border-color: #bbb; }
      #status { min-height: 1.4em; font-weight: 600; }
      #status.error { color: #c0392b; }
      #status.ok { color: #1f7a4a; }
    </style>
  </head>
  <body>
    <main>
      <h1>Vendas do painel lançadas à mão</h1>
      <p>Enquanto o painel não consegue ler o Bling, os números colados aqui aparecem na TV no lugar da leitura automática.
        Para voltar à leitura do Bling, use “Desligar lançamento manual”.</p>
      <textarea id="json" spellcheck="false"></textarea>
      <div class="actions">
        <button type="button" id="save">Salvar e mostrar na TV</button>
        <button type="button" class="secondary" id="example">Colar modelo</button>
        <button type="button" class="secondary" id="off">Desligar lançamento manual</button>
      </div>
      <div id="status"></div>
    </main>
    <script>
      const $ = (id) => document.getElementById(id);
      const EXAMPLE = {
        atualizadoEm: "20/10 14:30",
        mes: "2026-10",
        comparadoAteDia: 20,
        hoje: { total: 0, pedidos: 0 },
        contas: [
          { conta: "JZ", atual: { total: 0, pedidos: 0, pecas: 0 }, anterior: { total: 0, pedidos: 0, pecas: 0 } },
          { conta: "Ecommerce", atual: { total: 0, pedidos: 0, pecas: 0 }, anterior: { total: 0, pedidos: 0, pecas: 0 } }
        ],
        porDia: { atual: [], anterior: [] },
        canais: [{ nome: "Mercado Livre", conta: "Ecommerce", atual: 0, anterior: 0 }],
        skus: [{ sku: "", nome: "", quantidade: 0, valor: 0, conta: "JZ" }],
        vendedores: [{ nome: "", total: 0, pedidos: 0, hoje: 0 }]
      };

      function status(text, kind = "") {
        $("status").textContent = text;
        $("status").className = kind;
      }

      async function request(method, body) {
        const response = await fetch("/api/dashboard/tv-sales-manual", {
          method,
          headers: body ? { "Content-Type": "application/json" } : {},
          body: body ? JSON.stringify(body) : undefined
        });
        const payload = await response.json().catch(() => ({}));
        if (response.status === 401) throw new Error("Entre no Etiquefácil com a conta dona e recarregue esta página.");
        if (!response.ok) throw new Error(payload.error || "Erro ao falar com o servidor.");
        return payload;
      }

      $("example").addEventListener("click", () => {
        $("json").value = JSON.stringify(EXAMPLE, null, 2);
      });

      $("save").addEventListener("click", async () => {
        let manual;
        try {
          manual = JSON.parse($("json").value);
        } catch (error) {
          return status(`JSON com erro: ${error.message}`, "error");
        }
        try {
          const { preview } = await request("PUT", { manual });
          const total = Number(preview?.current?.total || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
          status(`Salvo. A TV mostra ${total} no mês na próxima atualização.`, "ok");
        } catch (error) {
          status(error.message, "error");
        }
      });

      $("off").addEventListener("click", async () => {
        if (!confirm("Desligar o lançamento manual e voltar a ler o Bling?")) return;
        try {
          await request("PUT", { manual: null });
          $("json").value = "";
          status("Lançamento manual desligado. A TV volta a ler o Bling.", "ok");
        } catch (error) {
          status(error.message, "error");
        }
      });

      request("GET")
        .then(({ manual }) => {
          $("json").value = manual ? JSON.stringify(manual, null, 2) : "";
          status(manual ? "Lançamento manual ligado." : "Sem lançamento manual: a TV lê o Bling.");
        })
        .catch((error) => status(error.message, "error"));
    </script>
  </body>
</html>
